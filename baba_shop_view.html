<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Baba Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #f5c518;
    --primary-dark: #b8891a;
    --secondary: #00d4ff;
    --bg-dark: #050a12;
    --bg-card: #0c1526;
    --bg-hover: #0f1d35;
    --bg-panel: #0f1d35;
    --text-primary: #e8f4fd;
    --text-secondary: #7ba7cc;
    --text-dim: #3d6080;
    --border: #1e3a5f;
    --border-bright: #2a5298;
    --success: #00e676;
    --warning: #f5c518;
    --danger: #ff4444;
    --accent-blue: #3d8ef0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { min-height: 100%; }
body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
}
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(61,142,240,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(61,142,240,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
}
body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 300px;
    background: radial-gradient(ellipse 80% 100% at 50% -20%, rgba(61,142,240,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}
.header {
    background: linear-gradient(180deg, rgba(12,21,38,0.98) 0%, rgba(5,10,18,0.95) 100%);
    padding: 12px 14px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
}
.header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1280px;
    margin: 0 auto;
}
.logo {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--primary);
    text-shadow: 0 0 12px rgba(245,197,24,0.3);
}
.currency-badge {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--secondary);
    background: rgba(0,212,255,0.08);
    border: 1px solid rgba(0,212,255,0.2);
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: 700;
}
.container { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 10px 14px 100px; }
</style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo">BABA SHOP</div>
        <div class="currency-badge" id="currencyBadge">Loading...</div>
    </div>
</div>
<div class="container">
    <div class="tabs" id="tabsContainer"></div>

    <!-- Category Grid (Show All) -->
    <div class="category-grid-container" id="categoryGridContainer">
        <div class="grid-header">
            <h3>Select Category</h3>
            <button class="close-grid-btn" onclick="hideAllCategories()">×</button>
        </div>
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <!-- Category Navigator -->
    <div class="category-nav" id="categoryNav">
        <button class="nav-btn" id="prevBtn" onclick="prevCategory()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="category-info" onclick="showAllCategories()">
            <img class="category-icon" id="categoryIcon" alt="">
            <div class="category-text">
                <div class="category-name" id="categoryName">Loading...</div>
                <div class="category-counter" id="categoryCounter">Click to see all</div>
            </div>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="nextCategory()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </div>

    <!-- Show All Button -->
    <button class="show-all-btn" id="showAllBtn" onclick="showAllCategories()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Show All Categories
    </button>

    <!-- Search -->
    <div class="search-box">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search items...">
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat"><span class="stat-value" id="totalItems">0</span><span class="stat-label">Items</span></div>
        <div class="stat"><span class="stat-value" id="buyableItems">0</span><span class="stat-label">Available</span></div>
    </div>

    <!-- Item List -->
    <div class="item-list" id="itemList">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading shop data...</p>
        </div>
    </div>
</div>

<!-- Purchase Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>Purchase Item</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="selected-item-card">
                <img class="selected-icon" id="modalIcon" alt="">
                <div class="selected-info">
                    <div class="selected-name" id="modalName">-</div>
                    <div class="selected-price" id="modalPrice">-</div>
                </div>
            </div>
            <div class="quantity-section">
                <label>Quantity</label>
                <div class="quantity-controls">
                    <button class="qty-btn" onclick="changeQty(-10)">-10</button>
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <input type="number" id="qtyInput" value="1" min="1">
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                    <button class="qty-btn" onclick="changeQty(10)">+10</button>
                </div>
            </div>
            <div class="total-section">
                <span>Total Cost</span>
                <span class="total-amount" id="totalCost">0</span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="buyMax()">Buy Max</button>
            <button class="btn btn-success" onclick="buyItem()">Buy Now</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<style>
/* Tabs */
.tabs {
    display: flex;
    gap: 8px;
    padding: 16px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.tab {
    flex: 1;
    min-width: 100px;
    padding: 14px 20px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
}
.tab:hover { border-color: var(--primary); color: var(--text-primary); }
.tab.active { background: var(--primary); border-color: var(--primary); color: white; }

/* Show All Button */
.show-all-btn {
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
    transition: all 0.2s;
}
.show-all-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,70,229,0.4); }
.show-all-btn:active { transform: scale(0.98); }

/* Category Grid Container */
.category-grid-container {
    display: none;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    border: 2px solid var(--primary);
    animation: slideDown 0.3s ease;
}
.category-grid-container.show { display: block; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.grid-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}
.grid-header h3 { font-size: 16px; font-weight: 700; }
.close-grid-btn {
    width: 32px;
    height: 32px;
    border: none;
    background: var(--bg-hover);
    color: var(--text-primary);
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
}
.close-grid-btn:hover { background: var(--danger); }

/* Category Grid */
.category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 12px;
}
.category-grid-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 8px;
    background: var(--bg-hover);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
}
.category-grid-item:hover { border-color: var(--primary); transform: translateY(-2px); }
.category-grid-item.active { border-color: var(--primary); background: rgba(255,107,53,0.15); }
.category-grid-item img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: contain;
    margin-bottom: 8px;
    background: var(--bg-dark);
    transition: opacity 0.3s ease;
}
.category-grid-item .cat-name {
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    color: var(--text-secondary);
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
}
.category-grid-item:hover .cat-name { color: var(--text-primary); }
.category-grid-item .cat-count {
    font-size: 10px;
    color: var(--primary);
    margin-top: 4px;
}

/* Category Navigator */
.category-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: var(--bg-card);
    border-radius: 16px;
    margin-bottom: 16px;
}
.nav-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: var(--bg-hover);
    color: var(--text-primary);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.nav-btn:hover { background: var(--primary); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn:disabled:hover { background: var(--bg-hover); }
.category-info {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
    cursor: pointer;
    padding: 8px;
    border-radius: 12px;
    transition: background 0.2s;
}
.category-info:hover { background: var(--bg-hover); }
.category-icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--bg-hover);
    object-fit: contain;
    border: 2px solid var(--border);
}
.category-text { text-align: left; }
.category-name { font-weight: 700; font-size: 16px; }
.category-counter { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

/* Search */
.search-box { position: relative; margin-bottom: 16px; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
.search-box input {
    width: 100%;
    padding: 16px 16px 16px 50px;
    background: var(--bg-card);
    border: 2px solid var(--border);
    border-radius: 14px;
    color: var(--text-primary);
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box input::placeholder { color: var(--text-secondary); }

/* Stats Bar */
.stats-bar { display: flex; gap: 12px; margin-bottom: 16px; }
.stat { flex: 1; background: var(--bg-card); padding: 14px; border-radius: 12px; text-align: center; }
.stat-value { display: block; font-size: 24px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

/* Item List */
.item-list { display: flex; flex-direction: column; gap: 10px; }

/* Item Card */
.item-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--bg-card);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s;
    border: 2px solid transparent;
}
.item-card:hover { background: var(--bg-hover); border-color: var(--border); }
.item-card:active { transform: scale(0.98); }
.item-card.disabled { opacity: 0.5; cursor: not-allowed; }
.item-card.disabled:hover { background: var(--bg-card); border-color: transparent; }
.item-icon {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: var(--bg-hover);
    object-fit: contain;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
}
.item-details { flex: 1; min-width: 0; }
.item-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.item-type { font-size: 13px; color: var(--text-secondary); }
.item-can-buy { 
    font-size: 12px; 
    color: var(--success); 
    margin-top: 2px;
    font-weight: 600;
}
.item-right { text-align: right; flex-shrink: 0; }
.item-price { font-weight: 700; font-size: 17px; color: var(--warning); }
.item-stock {
    font-size: 12px;
    margin-top: 4px;
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
}
.item-stock.unlimited { background: rgba(16,185,129,0.15); color: var(--success); }
.item-stock.limited { background: rgba(245,158,11,0.15); color: var(--warning); }
.item-stock.soldout { background: rgba(239,68,68,0.15); color: var(--danger); }

/* Loading & Empty States */
.loading-state, .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal {
    background: var(--bg-card);
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    animation: modalIn 0.3s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 18px; font-weight: 700; }
.close-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: var(--bg-hover);
    color: var(--text-primary);
    border-radius: 10px;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
}
.modal-body { padding: 20px; }
.selected-item-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    background: var(--bg-hover);
    border-radius: 14px;
    margin-bottom: 20px;
}
.selected-icon { width: 64px; height: 64px; border-radius: 12px; background: var(--bg-dark); object-fit: contain; }
.selected-info { flex: 1; }
.selected-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.selected-price { color: var(--warning); font-weight: 600; }
.quantity-section { margin-bottom: 20px; }
.quantity-section label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
.quantity-controls { display: flex; align-items: center; gap: 8px; }
.qty-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: var(--bg-hover);
    color: var(--text-primary);
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
}
.qty-btn:hover { background: var(--primary); }
.quantity-controls input {
    flex: 1;
    height: 44px;
    border: 2px solid var(--border);
    background: var(--bg-dark);
    color: var(--text-primary);
    border-radius: 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    outline: none;
}
.quantity-controls input:focus { border-color: var(--primary); }
.total-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: var(--bg-hover);
    border-radius: 12px;
}
.total-amount { font-size: 22px; font-weight: 800; color: var(--warning); }
.modal-footer { display: flex; gap: 10px; padding: 20px; border-top: 1px solid var(--border); }
.btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn:active { transform: scale(0.96); }
.btn-secondary { background: var(--bg-hover); color: var(--text-primary); }
.btn-primary { background: var(--primary); color: white; }
.btn-success { background: var(--success); color: white; }

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-card);
    color: var(--text-primary);
    padding: 16px 28px;
    border-radius: 14px;
    font-weight: 600;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    z-index: 2000;
    transition: transform 0.3s ease;
    border: 2px solid var(--border);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }

.tab:hover{background:rgba(255,255,255,.05);border-color:var(--accent-blue);color:var(--text-primary);transform:none}

.category-name{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--primary);text-transform:uppercase}
.category-counter{font-size:12px;color:var(--text-secondary)}
.search-box{margin-bottom:10px}
.search-icon{left:12px;color:var(--text-dim)}
.search-box input{padding:8px 10px 8px 38px;background:var(--bg-panel);border:1px solid var(--border);border-radius:5px;color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600}
.search-box input:focus{border-color:var(--accent-blue)}
.stats-bar{gap:8px;margin-bottom:10px}
.stat{background:var(--bg-panel);border:1px solid var(--border);border-radius:5px;padding:8px}
.stat-value{font-family:'Orbitron',monospace;font-size:18px;color:var(--primary)}
.stat-label{font-family:'Orbitron',monospace;font-size:9px;color:var(--text-secondary);letter-spacing:1px}
.item-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.item-card{align-items:center;gap:10px;padding:10px;background:rgba(12,21,38,.92);border:1px solid var(--border);border-radius:5px}
.item-card:hover{background:var(--bg-panel);border-color:var(--accent-blue);box-shadow:0 0 18px rgba(61,142,240,.16);transform:none}
.item-card.disabled{opacity:.42}
.item-icon{width:58px;height:58px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid var(--border-bright)}
.missing-icon{display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;color:var(--text-dim);font-size:18px}
.item-name{font-size:14px;font-weight:700;color:var(--text-primary);line-height:1.15}
.item-type{font-family:'Orbitron',monospace;font-size:9px;color:var(--secondary);letter-spacing:.6px;text-transform:uppercase}
.reward-strip{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.reward-mini{position:relative;width:28px;height:28px;border:1px solid var(--border);border-radius:4px;background:rgba(0,0,0,.22)}
.reward-mini img{width:100%;height:100%;object-fit:contain}
.reward-mini span{position:absolute;right:-3px;bottom:-4px;min-width:14px;padding:0 2px;border-radius:3px;background:rgba(0,0,0,.82);border:1px solid var(--border-bright);font-family:'Orbitron',monospace;font-size:8px;color:var(--primary);text-align:center}
.item-can-buy{font-size:12px;color:var(--success);font-weight:700}
.item-price{font-family:'Orbitron',monospace;font-size:14px;color:var(--primary)}
.item-stock{font-family:'Orbitron',monospace;font-size:9px;border-radius:4px;padding:3px 7px;border:1px solid transparent}
.item-stock.unlimited{background:rgba(0,230,118,.08);border-color:rgba(0,230,118,.22);color:var(--success)}
.item-stock.limited{background:rgba(245,197,24,.08);border-color:rgba(245,197,24,.25);color:var(--primary)}
.item-stock.soldout{background:rgba(255,68,68,.08);border-color:rgba(255,68,68,.25);color:var(--danger)}
.modal{background:var(--bg-card);border:1px solid var(--border-bright);border-radius:6px;box-shadow:0 20px 80px rgba(0,0,0,.55)}
.modal-header{padding:12px 14px;border-bottom:1px solid var(--border)}
.modal-header h3{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:1.5px;color:var(--primary);text-transform:uppercase}
.close-btn{background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary)}
.modal-body{padding:14px}
.selected-item-card,.total-section{background:var(--bg-panel);border:1px solid var(--border);border-radius:5px}
.selected-icon{border-radius:4px;border:1px solid var(--border-bright)}
.quantity-section label{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase}
.qty-btn,.quantity-controls input{border-radius:4px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-primary);font-family:'Orbitron',monospace}
.qty-btn:hover{background:rgba(61,142,240,.18);border-color:var(--accent-blue);color:#fff}
.modal-footer{padding:12px 14px;border-top:1px solid var(--border)}
.btn{border-radius:5px;font-family:'Orbitron',monospace;font-size:10px;letter-spacing:.8px;text-transform:uppercase}
.btn-secondary{background:var(--bg-panel);border:1px solid var(--border);color:var(--text-primary)}
.btn-primary{background:linear-gradient(135deg,#1a3d6e,var(--accent-blue));color:#fff}
.btn-success{background:linear-gradient(135deg,#1a5c2a,var(--success));color:#001609}
.toast{background:var(--bg-card);border:1px solid var(--border-bright);border-radius:5px;font-family:'Rajdhani',sans-serif}
@media(max-width:640px){.container{padding:8px 8px 90px}.header{padding:10px 8px}.item-list{grid-template-columns:1fr}.tabs{gap:4px}.tab{min-width:92px;padding:6px 9px;font-size:9px}.category-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.item-card{padding:8px}.item-icon{width:50px;height:50px}}
</style>

<script>
// State
let shopData = null;
let currentTab = 'treasure';
let currentCategoryIndex = 0;
let selectedItem = null;
let searchQuery = '';
let showingAllCategories = false;

const API_BASE = '';
const IMG_BASE = '/proxy_img';

// Image cache for faster loading
const imageCache = new Map();

function getItemIconUrls(item) {
    const urls = [];
    const mainUrl = getItemIcon(item);
    if (mainUrl) urls.push(mainUrl);
    (item.reward_items || []).forEach(reward => {
        const rewardUrl = getItemIcon(reward);
        if (rewardUrl) urls.push(rewardUrl);
    });
    return urls;
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    bindEvents();
    loadShopData();
});

function preloadImages(urls) {
    // Preload array of image URLs in background
    urls.forEach(url => {
        if (url && !imageCache.has(url)) {
            const img = new Image();
            img.onload = () => imageCache.set(url, url);
            img.src = url;
        }
    });
}

// Preload ALL images in background for instant display
function preloadAllImages() {
    if (!shopData) return;
    
    // Collect all image URLs from all tabs and categories
    const allUrls = new Set();
    
    // Preload category icons
    Object.keys(shopData).forEach(tab => {
        const categories = shopData[tab]?.categories || [];
        categories.forEach(cat => {
            const iconUrl = getCurrencyIcon(cat);
            if (iconUrl) allUrls.add(iconUrl);
            
            // Preload all item icons in this category
            if (cat.items) {
                cat.items.forEach(item => {
                    getItemIconUrls(item).forEach(url => allUrls.add(url));
                });
            }
        });
    });
    
    // Batch preload with small delays to avoid blocking UI
    const urlsArray = Array.from(allUrls);
    const batchSize = 10; // Load 10 images at a time
    let currentIndex = 0;
    
    function loadBatch() {
        const batch = urlsArray.slice(currentIndex, currentIndex + batchSize);
        preloadImages(batch);
        currentIndex += batchSize;
        
        if (currentIndex < urlsArray.length) {
            // Continue loading next batch after small delay
            setTimeout(loadBatch, 50);
        }
    }
    
    // Start loading immediately
    loadBatch();
}

// Preload current category images immediately (for instant display)
function preloadCurrentCategory() {
    const cat = getCurrentCategory();
    if (!cat || !cat.items) return;
    
    const urls = [];
    cat.items.forEach(item => {
        getItemIconUrls(item).forEach(url => urls.push(url));
    });
    preloadImages(urls);
}

function bindEvents() {
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderItems();
    });
    document.getElementById('qtyInput').addEventListener('input', updateTotal);
}

function loadShopData() {
    fetch(API_BASE + '/api/shop_data')
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                showToast(data.error, 'error');
                return;
            }
            shopData = data;
            renderTabs();
            render();
        })
        .catch(err => {
            console.error('Load error:', err);
            document.getElementById('itemList').innerHTML = `
                <div class="empty-state">
                    <p>Failed to load shop data</p>
                    <p style="font-size:13px;margin-top:8px">Check if server is running</p>
                </div>`;
        });
}

function preloadCategoryIcons() {
    const cats = getCategories();
    const urls = cats.map(cat => getCurrencyIcon(cat)).filter(Boolean);
    preloadImages(urls);
}

function renderTabs() {
    if (!shopData) return;
    const tabs = Object.keys(shopData);
    const container = document.getElementById('tabsContainer');
    container.innerHTML = tabs.map(tab => 
        `<button class="tab ${tab === currentTab ? 'active' : ''}" data-tab="${tab}">${capitalizeFirst(tab)}</button>`
    ).join('');
    
    container.querySelectorAll('.tab').forEach(tabEl => {
        tabEl.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');
            currentTab = tabEl.dataset.tab;
            currentCategoryIndex = 0;
            hideAllCategories();
            render();
        });
    });
}

function capitalizeFirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
}

function getCategories() {
    if (!shopData || !shopData[currentTab]) return [];
    return shopData[currentTab].categories || [];
}

function getCurrentCategory() {
    const cats = getCategories();
    return cats[currentCategoryIndex] || null;
}

function prevCategory() {
    if (currentCategoryIndex > 0) {
        currentCategoryIndex--;
        render();
        // Preload current category images if not already loaded
        setTimeout(preloadCurrentCategory, 50);
    }
}

function nextCategory() {
    const cats = getCategories();
    if (currentCategoryIndex < cats.length - 1) {
        currentCategoryIndex++;
        render();
        // Preload current category images if not already loaded
        setTimeout(preloadCurrentCategory, 50);
    }
}
</script>

<script>
function showAllCategories() {
    const cats = getCategories();
    if (cats.length === 0) return;
    
    const grid = document.getElementById('categoryGrid');
    grid.innerHTML = cats.map((cat, idx) => {
        const iconUrl = getCurrencyIcon(cat);
        const iconHtml = iconUrl ? `<img src="${iconUrl}" alt="" loading="lazy" onerror="this.style.display='none'">` : '<div class="category-icon missing-icon">?</div>';
        const itemCount = cat.items ? cat.items.length : 0;
        const activeClass = idx === currentCategoryIndex ? 'active' : '';
        return `
            <div class="category-grid-item ${activeClass}" onclick="selectCategory(${idx})">
                ${iconHtml}
                <div class="cat-name">${escapeHtml(cat.name)}</div>
                <div class="cat-count">${itemCount} items</div>
            </div>`;
    }).join('');
    
    document.getElementById('categoryGridContainer').classList.add('show');
    document.getElementById('showAllBtn').style.display = 'none';
    showingAllCategories = true;
}

function hideAllCategories() {
    document.getElementById('categoryGridContainer').classList.remove('show');
    document.getElementById('showAllBtn').style.display = 'flex';
    showingAllCategories = false;
}

function selectCategory(index) {
    currentCategoryIndex = index;
    hideAllCategories();
    render();
    // Preload current category images if not already loaded
    setTimeout(preloadCurrentCategory, 50);
}

function getItemIcon(type, itemId) {
    if (type && typeof type === 'object') {
        if (type.icon_path) return `${IMG_BASE}/${type.icon_path}`;
        itemId = type.item_id;
        type = type.type;
    }
    if (!itemId) return '';
    const t = (type || '').toLowerCase().replace(/\s+/g, '');
    const id = String(itemId).padStart(5, '0');
    
    if (t === 'card' || t.endsWith('::card')) {
        const baseId = Math.floor(itemId / 10) * 10;
        return `${IMG_BASE}/character/thumb/card_${baseId}_thumb/card_${baseId}_thumb.png`;
    }
    if (t.includes('awakening')) return `${IMG_BASE}/item/awaken/en/thumb/thumb_awaken_items_${id}/thumb_awaken_items_${id}.png`;
    if (t.includes('support') && !t.includes('memory')) return `${IMG_BASE}/item/support/thumb/thumb_support_item_${id}.png`;
    if (t.includes('training') && !t.includes('field')) return `${IMG_BASE}/item/training/thumb/thumb_training_item_${id}.png`;
    if (t.includes('potential')) return `${IMG_BASE}/item/potential/thumb/thumb_potential_item_${id}.png`;
    if (t.includes('treasure')) return `${IMG_BASE}/item/other/en/thumb/thumb_trade_jewel_${id}/thumb_trade_jewel_${id}.png`;
    if (t.includes('field')) return `${IMG_BASE}/item/training_field/thumb/thumb_training_field_${id}.png`;
    if (t.includes('memory')) return `${IMG_BASE}/item/support_memory/thumb/thumb_support_memory_${id}.png`;
    if (t.includes('kagi')) return `${IMG_BASE}/item/eventkagi/thumb/thumb_eventkagi_item_${id}.png`;
    if (t.includes('statusextension') || t.includes('cardcapacity') || t.includes('teamcostcapacity') || t.includes('actmax') || t.includes('friendcapacity')) return `${IMG_BASE}/item/status_extension/thumb/thumb_status_extension_${id}.png`;
    if (t.includes('cardsticker')) return `${IMG_BASE}/item/card_sticker/thumb/thumb_card_sticker_item_${id}.png`;
    if (t.includes('special')) return `${IMG_BASE}/item/other/en/thumb/thumb_other_${id}/thumb_other_${id}.png`;
    if (t.includes('actitem')) return `${IMG_BASE}/item/act/thumb/thumb_act_item_${id}.png`;
    return '';
}

function getCurrencyIcon(categoryOrId) {
    if (categoryOrId && typeof categoryOrId === 'object') {
        if (categoryOrId.currency_icon_path) return `${IMG_BASE}/${categoryOrId.currency_icon_path}`;
        categoryOrId = categoryOrId.currency_id;
    }
    const currencyId = categoryOrId;
    if (!currencyId) return '';
    const id = String(currencyId).padStart(5, '0');
    return `${IMG_BASE}/item/other/en/thumb/thumb_trade_jewel_${id}/thumb_trade_jewel_${id}.png`;
}

function renderItemIcon(item, className = 'item-icon', loadingAttr = '') {
    const iconUrl = getItemIcon(item);
    if (!iconUrl) return `<div class="${className} missing-icon">?</div>`;
    return `<img class="${className}" src="${iconUrl}" alt="" ${loadingAttr} onerror="this.outerHTML='<div class=&quot;${className} missing-icon&quot;>?</div>'">`;
}

function renderRewardStrip(item) {
    const rewards = item.reward_items || [];
    if (rewards.length <= 1) return '';
    return `<div class="reward-strip">${rewards.map(reward => {
        const iconUrl = getItemIcon(reward);
        const qty = reward.quantity && reward.quantity > 1 ? `<span>${reward.quantity}</span>` : '';
        const img = iconUrl ? `<img src="${iconUrl}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
        return `<div class="reward-mini" title="${escapeHtml(reward.name || '')}">${img}${qty}</div>`;
    }).join('')}</div>`;
}

function render() {
    const cats = getCategories();
    const cat = getCurrentCategory();
    
    // Update currency badge
    const currencyBadge = document.getElementById('currencyBadge');
    currencyBadge.textContent = cat ? `${(cat.owned || 0).toLocaleString()}` : 'Loading...';
    
    // Update category nav
    const categoryNav = document.getElementById('categoryNav');
    if (cats.length > 0 && cat) {
        categoryNav.style.display = 'flex';
        document.getElementById('categoryName').textContent = cat.name;
        document.getElementById('categoryCounter').textContent = `${currentCategoryIndex + 1} / ${cats.length} • Click to see all`;
        
        const iconUrl = getCurrencyIcon(cat);
        const iconEl = document.getElementById('categoryIcon');
        if (iconUrl) {
            iconEl.src = iconUrl;
            iconEl.style.display = 'block';
            iconEl.onerror = () => iconEl.style.display = 'none';
        } else {
            iconEl.style.display = 'none';
        }
        
        document.getElementById('prevBtn').disabled = currentCategoryIndex === 0;
        document.getElementById('nextBtn').disabled = currentCategoryIndex === cats.length - 1;
    } else {
        categoryNav.style.display = 'none';
    }
    
    renderItems();
}
</script>

<script>
function renderItems() {
    const cat = getCurrentCategory();
    const container = document.getElementById('itemList');
    
    if (!cat || !cat.items || cat.items.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No items available</p></div>';
        updateStats(0, 0);
        return;
    }
    
    let items = cat.items;
    if (searchQuery) {
        items = items.filter(item => 
            item.name.toLowerCase().includes(searchQuery) ||
            item.type.toLowerCase().includes(searchQuery)
        );
    }
    
    if (items.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No items match your search</p></div>';
        updateStats(0, 0);
        return;
    }
    
    let buyableCount = 0;
    const owned = cat.owned || 0;  // Current balance
    
    const html = items.map(item => {
        const stockText = item.stock === -1 ? 'Unlimited' : item.stock;
        let stockClass = 'unlimited';
        if (item.stock === 0) stockClass = 'soldout';
        else if (item.stock > 0 && item.stock <= 5) stockClass = 'limited';
        
        // Calculate how many times can buy
        const canBuyTimes = item.price > 0 ? Math.floor(owned / item.price) : 0;
        const maxCanBuy = item.stock === -1 ? canBuyTimes : Math.min(canBuyTimes, item.stock);
        const canBuyText = maxCanBuy > 0 ? `Can buy: ${maxCanBuy}x` : 'Cannot afford';
        
        if (item.buyable) buyableCount++;
        const disabledClass = item.buyable ? '' : 'disabled';
        
        // Use eager loading for first page, lazy for others (images are preloaded in background)
        // First 20 items load immediately, rest use lazy loading
        const isFirstPage = items.indexOf(item) < 20;
        const loadingAttr = isFirstPage ? '' : 'loading="lazy"';
        const rewardStrip = renderRewardStrip(item);
        
        return `
            <div class="item-card ${disabledClass}" onclick="selectItem(${item.id})">
                ${renderItemIcon(item, 'item-icon', loadingAttr)}
                <div class="item-details">
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    <div class="item-type">${item.type}</div>
                    ${rewardStrip}
                    <div class="item-can-buy">${canBuyText}</div>
                </div>
                <div class="item-right">
                    <div class="item-price">${item.price.toLocaleString()}</div>
                    <div class="item-stock ${stockClass}">${stockText}</div>
                </div>
            </div>`;
    }).join('');
    
    container.innerHTML = html;
    updateStats(items.length, buyableCount);
    
}


function preloadNextCategoryItems() {
    const cats = getCategories();
    const nextIdx = currentCategoryIndex + 1;
    if (nextIdx < cats.length) {
        const nextCat = cats[nextIdx];
        if (nextCat && nextCat.items) {
            // Preload first 10 items of next category
            const urls = [];
            nextCat.items.slice(0, 10).forEach(item => {
                getItemIconUrls(item).forEach(url => urls.push(url));
            });
            setTimeout(() => preloadImages(urls), 500);
        }
    }
}

function updateStats(total, buyable) {
    document.getElementById('totalItems').textContent = total;
    document.getElementById('buyableItems').textContent = buyable;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function selectItem(id) {
    const cat = getCurrentCategory();
    if (!cat) return;
    
    selectedItem = cat.items.find(item => item.id === id);
    if (!selectedItem || !selectedItem.buyable) return;
    
    const iconUrl = getItemIcon(selectedItem);
    const modalIcon = document.getElementById('modalIcon');
    if (iconUrl) {
        modalIcon.src = iconUrl;
        modalIcon.style.display = 'block';
    } else {
        modalIcon.removeAttribute('src');
        modalIcon.style.display = 'none';
    }
    document.getElementById('modalName').textContent = selectedItem.name;
    
    // Calculate max can buy
    const owned = cat.owned || 0;
    const canBuyTimes = selectedItem.price > 0 ? Math.floor(owned / selectedItem.price) : 0;
    const maxCanBuy = selectedItem.stock === -1 ? canBuyTimes : Math.min(canBuyTimes, selectedItem.stock);
    
    document.getElementById('modalPrice').textContent = `${selectedItem.price.toLocaleString()} each • Max: ${maxCanBuy}x`;
    
    const qtyInput = document.getElementById('qtyInput');
    qtyInput.value = 1;
    qtyInput.max = maxCanBuy > 0 ? maxCanBuy : 1;
    
    updateTotal();
    document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    selectedItem = null;
}

function changeQty(delta) {
    const input = document.getElementById('qtyInput');
    const max = parseInt(input.max) || 999;
    const newVal = Math.max(1, Math.min(max, (parseInt(input.value) || 1) + delta));
    input.value = newVal;
    updateTotal();
}

function updateTotal() {
    if (!selectedItem) return;
    const qty = parseInt(document.getElementById('qtyInput').value) || 1;
    document.getElementById('totalCost').textContent = (selectedItem.price * qty).toLocaleString();
}

function buyItem() {
    if (!selectedItem) return;
    const qty = parseInt(document.getElementById('qtyInput').value) || 1;
    executeBuy(selectedItem.shop_type || currentTab, selectedItem.id, qty);
}

function buyMax() {
    if (!selectedItem) return;
    const cat = getCurrentCategory();
    if (!cat) return;
    
    // Calculate actual max can buy based on balance
    const owned = cat.owned || 0;
    const canBuyTimes = selectedItem.price > 0 ? Math.floor(owned / selectedItem.price) : 0;
    const maxQty = selectedItem.stock === -1 ? canBuyTimes : Math.min(canBuyTimes, selectedItem.stock);
    
    if (maxQty <= 0) {
        showToast('Cannot afford this item', 'error');
        return;
    }
    
    executeBuy(selectedItem.shop_type || currentTab, selectedItem.id, maxQty);
}

function executeBuy(shopType, itemId, quantity) {
    showToast('Processing purchase...', 'info');
    
    fetch(`${API_BASE}/api/buy?type=${shopType}&id=${itemId}&qty=${quantity}`)
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                showToast(result.message || 'Purchase successful!', 'success');
                closeModal();
                
                // Fast update: Only update balance and stock instead of full reload
                updateAfterPurchase(itemId, quantity);
            } else {
                showToast(result.error || 'Purchase failed', 'error');
            }
        })
        .catch(() => showToast('Network error', 'error'));
}

function updateAfterPurchase(itemId, quantity) {
    // Update current category's owned balance
    const cat = getCurrentCategory();
    if (!cat) {
        // Fallback to full reload if no category
        loadShopData();
        return;
    }
    
    // Find the purchased item
    const item = cat.items.find(i => i.id === itemId);
    if (!item) {
        loadShopData();
        return;
    }
    
    // Update balance (subtract cost)
    const totalCost = item.price * quantity;
    cat.owned = Math.max(0, cat.owned - totalCost);
    
    // Update stock
    if (item.stock !== -1) {
        item.stock = Math.max(0, item.stock - quantity);
        item.buyable = item.stock > 0;
    }
    
    // Re-render current view (much faster than full reload)
    render();
    
    // No automatic reload - user can manually refresh if needed
    // This makes buying much faster!
}

function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
