<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dokkan Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg-deep:#050a12;--bg-card:#0c1526;--bg-panel:#0f1d35;
--border-dim:#1e3a5f;--border-bright:#2a5298;
--accent-gold:#f5c518;--accent-blue:#3d8ef0;--accent-cyan:#00d4ff;
--green-max:#00e676;--red-low:#ff4444;
--text-primary:#e8f4fd;--text-secondary:#7ba7cc;--text-dim:#3d6080;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg-deep);color:var(--text-primary);font-family:'Rajdhani',sans-serif;overflow-x:hidden;color-scheme:dark}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(61,142,240,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(61,142,240,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:300px;background:radial-gradient(ellipse 80% 100% at 50% -20%,rgba(61,142,240,0.1) 0%,transparent 70%);pointer-events:none;z-index:0}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
@media(max-width:480px){html,body{background:#02060d}body::before{background-image:linear-gradient(rgba(61,142,240,0.018) 1px,transparent 1px),linear-gradient(90deg,rgba(61,142,240,0.018) 1px,transparent 1px)}body::after{background:radial-gradient(ellipse 80% 100% at 50% -20%,rgba(61,142,240,0.055) 0%,transparent 72%)}}
.page{position:relative;z-index:1}
.header{background:linear-gradient(180deg,rgba(12,21,38,0.98) 0%,rgba(5,10,18,0.95) 100%);padding:12px 14px 10px;border-bottom:1px solid var(--border-dim);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:900;letter-spacing:3px;color:var(--accent-gold);text-shadow:0 0 12px rgba(245,197,24,0.3)}
.header-badge{font-family:'Orbitron',monospace;font-size:11px;color:var(--accent-cyan);background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);padding:3px 10px;border-radius:4px}
.filter-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sel{background:var(--bg-panel);border:1px solid var(--border-dim);color:var(--text-primary);padding:6px 10px;border-radius:5px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;cursor:pointer;outline:none}
.sel:focus{border-color:var(--accent-blue)}
.rarity-group,.disp-group{display:flex;gap:2px;background:var(--bg-panel);border:1px solid var(--border-dim);border-radius:5px;padding:3px}
.tab-btn{padding:4px 10px;border:none;background:transparent;color:var(--text-secondary);border-radius:3px;cursor:pointer;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:0.5px;transition:all 0.15s}
.tab-btn:hover{background:rgba(255,255,255,0.05);color:var(--text-primary)}
.tab-btn.active{background:var(--accent-gold);color:#000}
.tab-btn.active-blue{background:var(--accent-blue);color:#fff}
.disp-group{margin-left:auto}
.team-section{padding:10px 14px;border-bottom:1px solid var(--border-dim)}
.team-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.team-title{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--green-max)}
.team-count{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--accent-gold);background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.2);padding:2px 8px;border-radius:3px}
.queue-wrap{min-height:56px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(0,0,0,0.3);border:1px solid var(--border-dim);border-radius:5px;padding:6px;margin-bottom:8px}
.queue-empty{color:var(--text-dim);font-size:11px;font-style:italic;letter-spacing:0.5px}
.queue-item{position:relative;width:50px;text-align:center}
.queue-item img{width:100%;height:50px;object-fit:contain;border-radius:4px;border:1px solid var(--border-bright)}
.queue-item .rm-btn{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--red-low);color:#fff;border:none;font-size:9px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.queue-item .pos{font-family:'Orbitron',monospace;font-size:8px;font-weight:700;color:var(--green-max);margin-top:2px}
.queue-item.leader{background:rgba(245,197,24,0.15);border:1.5px solid var(--accent-gold);border-radius:5px;padding:3px}
.queue-item.leader .pos{color:var(--accent-gold)}
.team-btns{display:flex;gap:6px;align-items:center}
.team-btn{padding:8px 14px;border:none;border-radius:5px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;letter-spacing:0.5px;cursor:pointer;transition:all 0.2s}
.team-btn.off{opacity:0.35;pointer-events:none}
.team-btn.save{background:linear-gradient(135deg,#1a5c2a,var(--green-max));color:#000}
.team-btn.clr{background:linear-gradient(135deg,#5c1a1a,var(--red-low));color:#fff}
.deck-sel{padding:6px 10px;background:var(--bg-panel);border:1px solid var(--border-dim);border-radius:5px;color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;cursor:pointer;outline:none}
.filters-section{padding:8px 14px;border-bottom:1px solid var(--border-dim)}
.filters-grid{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:0.3px;user-select:none}
.chk-label input[type="checkbox"]{display:none}
.chk-box{width:13px;height:13px;border:1.5px solid var(--text-dim);border-radius:2px;flex-shrink:0;position:relative;transition:all 0.15s}
.chk-label input:checked~.chk-box{background:var(--accent-blue);border-color:var(--accent-blue)}
.chk-label input:checked~.chk-box::after{content:'';position:absolute;inset:1px;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%)}
.chk-label input:checked~span{color:var(--text-primary)}
.search-input{flex:1;min-width:160px;padding:6px 10px;background:var(--bg-panel);border:1px solid var(--border-dim);border-radius:5px;color:var(--text-primary);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:500;outline:none}
.search-input::placeholder{color:var(--text-dim)}
.search-input:focus{border-color:var(--accent-blue)}
.main-content{padding:10px 14px;position:relative}
.main-content::before{content:'';position:absolute;inset:0;background:rgba(5,10,18,0.7);pointer-events:none}
.grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.grid.grid-more{grid-template-columns:repeat(8,1fr);gap:5px}
.grid.grid-more .card-frame{width:64px;height:80px}
.grid.grid-more .card-layer.card-bg{width:80px;height:80px}
.grid.grid-more .card-layer.card-thumb{width:100px;height:100px}
.grid.grid-more .card-layer.card-type,.grid.grid-more .card-layer.card-rarity{width:36px;height:36px}
.grid.grid-more .card-bg-bottom{width:80px;left:8px;margin-top:8px}
.grid.grid-more .hp{font-size:10px}
.grid.grid-cols-15{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;justify-content:start;justify-items:center}
.grid.grid-cols-15 .card-frame{width:80px;height:100px}
.grid.grid-cols-15 .card-layer.card-bg{width:100px;height:100px}
.grid.grid-cols-15 .card-layer.card-thumb{width:125px;height:125px}
.grid.grid-cols-15 .card-layer.card-type{width:50px;height:50px}
.grid.grid-cols-15 .card-layer.card-rarity{width:50px;height:50px}
.grid.grid-cols-15 .card-bg-bottom{width:100px;left:10px;margin-top:13px}
.grid.grid-cols-15 .hp{font-size:12px}
.card{cursor:pointer;transition:transform 0.12s;position:relative}
.card:hover{transform:scale(1.07);z-index:5}
.card-inner{border-radius:5px;overflow:visible;position:relative}
.card.sel .card-inner{outline:2px solid var(--green-max);outline-offset:1px;border-radius:5px}
.card-frame{display:grid;width:80px;height:100px;overflow:visible;position:relative}
.card-layer{grid-column:1;grid-row:1;pointer-events:none}
.card-layer.card-bg{width:100px;height:100px;justify-self:center;align-self:center}
.card-layer.card-bg img{width:100%;height:100%;display:block}
.card-layer.card-thumb{width:125px;height:125px;justify-self:center;align-self:center}
.card-layer.card-thumb img{width:100%;height:100%;display:block}
.card-layer.card-type{width:50px;height:50px;justify-self:end;align-self:start}
.card-layer.card-type img{width:100%;height:100%;object-fit:contain}
.card-layer.card-rarity{width:50px;height:50px;justify-self:start;align-self:end}
.card-layer.card-rarity img{width:100%;height:100%;object-fit:contain}
.card-layer.card-pos{justify-self:center;align-self:end;background:var(--green-max);padding:2px 8px;border-radius:3px;font-family:'Orbitron',monospace;font-size:8px;font-weight:700;color:#000;margin-bottom:5px;pointer-events:none}
.card-bg-bottom{width:100px;height:auto;position:relative;margin-top:13px;left:10px}
.card-bg-bottom img{width:100%;height:auto;display:block;border-radius:3px}
.card-info-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.hp{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:#fff;text-shadow:1px 1px 3px #000,0 0 6px #000}
.pagi-wrap{position:relative;padding:10px 14px 6px}
.pagi{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.pagi-btn{padding:5px 10px;border:1px solid var(--border-dim);background:var(--bg-panel);color:var(--text-secondary);border-radius:4px;cursor:pointer;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;transition:all 0.15s}
.pagi-btn:hover{border-color:var(--accent-blue);color:var(--text-primary)}
.pagi-btn.active{background:linear-gradient(135deg,#b8891a,var(--accent-gold));color:#000;border-color:var(--accent-gold)}
.pagi-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none}
.pagi-count{color:var(--text-secondary);font-size:11px;font-weight:600}
.page-goto{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px 10px}
.page-goto span{color:var(--text-secondary);font-size:12px;font-weight:600}
.page-goto input{width:56px;padding:5px;text-align:center;background:var(--bg-panel);border:1px solid var(--border-dim);border-radius:4px;color:var(--text-primary);font-family:'Orbitron',monospace;font-size:11px;font-weight:700;outline:none}
.page-goto input:focus{border-color:var(--accent-blue)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:6px;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:0.5px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.toast.show{opacity:1}
.toast.success{background:var(--green-max);color:#000}
.toast.error{background:var(--red-low);color:#fff}
.saved-section{padding:10px 14px;border-top:1px solid var(--border-dim)}
.saved-title{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--accent-cyan);margin-bottom:8px}
.saved-list{display:flex;flex-direction:column;gap:6px}
.saved-item{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--border-dim);border-radius:5px;padding:8px 12px}
.saved-deck{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:var(--accent-gold);min-width:65px}
.saved-cards{display:flex;gap:3px}
.saved-cards img{width:32px;height:32px;object-fit:contain;border-radius:3px;border:1px solid var(--border-dim)}
.saved-cards .leader-img{border-color:var(--accent-gold)}
@media(max-width:480px){
.header{padding:8px 10px 8px}
.header-title{font-size:13px;letter-spacing:2px}
.filter-top{gap:4px}
.sel{padding:5px 7px;font-size:11px}
.tab-btn{padding:4px 7px;font-size:8px}
.filters-grid{gap:5px}
.search-input{min-width:120px;font-size:11px}
.team-section{padding:8px 10px}
.queue-item{width:42px}
.queue-item img{height:42px}
.team-btn{font-size:8px;padding:7px 8px}
.deck-sel{padding:5px 7px;font-size:11px}
.filters-section{padding:6px 10px}
.main-content{padding:8px 6px}
.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.grid.grid-more{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.card{width:100%;min-width:0}
.card-inner{display:flex;flex-direction:column;align-items:center}
.card-frame{width:100%;max-width:60px;height:68px}
.card-layer.card-bg{width:64px;height:64px}
.card-layer.card-thumb{width:78px;height:78px}
.card-layer.card-type{width:28px;height:28px}
.card-layer.card-rarity{width:28px;height:28px}
.card-bg-bottom{width:64px;left:0;margin-top:5px}
.hp{font-size:8px}
.pagi-btn{padding:4px 8px;font-size:8px}
.page-goto{gap:5px;padding:5px 10px 8px}
.page-goto input{width:46px;font-size:10px}
.saved-item{flex-wrap:wrap;gap:6px;padding:6px 8px}
.saved-deck{min-width:unset}
}
@media(max-width:480px){
.grid,.grid.grid-more,.grid.grid-cols-15{grid-template-columns:repeat(5,minmax(0,1fr));justify-content:stretch;justify-items:center;align-items:start;gap:8px 4px}
.card{width:100%;min-width:0;display:flex;justify-content:center}
.card-inner{width:100%;max-width:76px;display:flex;flex-direction:column;align-items:center}
.card-frame,.grid.grid-more .card-frame,.grid.grid-cols-15 .card-frame{width:min(100%,76px);max-width:none;height:auto;aspect-ratio:76/68;margin:0 auto}
.card-layer.card-bg,.grid.grid-more .card-layer.card-bg,.grid.grid-cols-15 .card-layer.card-bg{width:88%;height:auto;aspect-ratio:1}
.card-layer.card-thumb,.grid.grid-more .card-layer.card-thumb,.grid.grid-cols-15 .card-layer.card-thumb{width:104%;height:auto;aspect-ratio:1}
.card-layer.card-thumb img,.grid.grid-more .card-layer.card-thumb img,.grid.grid-cols-15 .card-layer.card-thumb img{width:100%;height:100%;display:block}
.card-layer.card-type,.card-layer.card-rarity,.grid.grid-more .card-layer.card-type,.grid.grid-more .card-layer.card-rarity,.grid.grid-cols-15 .card-layer.card-type,.grid.grid-cols-15 .card-layer.card-rarity{width:36%;height:auto;aspect-ratio:1}
.card-layer.card-rarity,.grid.grid-more .card-layer.card-rarity,.grid.grid-cols-15 .card-layer.card-rarity{width:42%;height:auto;aspect-ratio:1;justify-self:start;align-self:end;transform:translate(-6%,10%)}
.card-layer.card-rarity img,.grid.grid-more .card-layer.card-rarity img,.grid.grid-cols-15 .card-layer.card-rarity img{width:118%;height:118%;object-fit:contain;display:block}
.card-bg-bottom,.grid.grid-more .card-bg-bottom,.grid.grid-cols-15 .card-bg-bottom{width:88%;left:0;margin-top:-5px}
}

.card-layer.card-bg{z-index:1}
.card-layer.card-thumb{z-index:3}
.card-effect-canvas{position:absolute;left:50%;top:50%;width:210%;height:auto;aspect-ratio:256/462;transform:translate(-50%,-50%);pointer-events:none;z-index:4;mix-blend-mode:screen;opacity:0.92}
.card-layer.card-type,.card-layer.card-rarity{z-index:5}
@media(max-width:480px){.card-effect-canvas{width:190%;height:auto;left:50%;top:50%}}

</style></head><body>
<div class="page">
<header class="header">
<div class="header-top">
<div class="header-title">TEAM BUILDER</div>
<div class="header-badge"><span id="cnt">0/6</span></div>
</div>
<div class="filter-top">
<select id="srt" class="sel" onchange="flt()">
<option value="cost_d">Cost High</option><option value="cost_a">Cost Low</option>
<option value="link_a">Link% Low</option><option value="link_d">Link% High</option>

<option value="id_d">ID High</option><option value="id_a">ID Low</option>
<option value="rn_d">Rarity</option><option value="atk_d">ATK</option>
</select>
<select id="fT" class="sel" onchange="flt()">
<option value="">All Types</option>
<option>STR</option><option>AGL</option><option>PHY</option><option>TEQ</option><option>INT</option>
</select>
<div class="rarity-group">
<button class="tab-btn active" onclick="fltR('')">ALL</button>
<button class="tab-btn" onclick="fltR('LR')">LR</button>
<button class="tab-btn" onclick="fltR('UR')">UR</button>
<button class="tab-btn" onclick="fltR('SSR')">SSR</button>
<button class="tab-btn" onclick="fltR('SR')">SR</button>
<button class="tab-btn" onclick="fltR('R')">R</button>
</div>
<div class="disp-group">
<button class="tab-btn active-blue" onclick="setDisp('cost')">COST</button>
<button class="tab-btn" onclick="setDisp('link')" title="Percentage of link skills at Lv.10">LINK%</button>

<button class="tab-btn" onclick="setDisp('atk')">ATK</button>
<button class="tab-btn" onclick="setDisp('hp')">HP</button>
<button class="tab-btn" onclick="setDisp('df')">DEF</button>
</div>
</div>
</header>
<div class="team-section">
<div class="team-header">
<div class="team-title">TEAM QUEUE (1ST = LEADER)</div>
<div class="team-count" id="cnt2">0/6</div>
</div>
<div class="queue-wrap" id="queue"><span class="queue-empty">Click cards to build team (max 6)...</span></div>
<div class="team-btns">
<select id="deck" class="deck-sel"></select>
<button class="team-btn save off" id="btnGo" onclick="doSave()">SAVE TEAM</button>
<button class="team-btn clr" onclick="clrQ()">CLEAR</button>
</div>
</div>
<div class="filters-section">

<script>
var CARD_EFFECT='ef_001';
var CARD_EFFECT_W=852,CARD_EFFECT_H=1536;
var cardEffectState={ready:false,loading:false,source:null,lwf:null,targets:[],lastTime:0};
function cardEffectUrl(name){return '/en/'+String(name||'').replace(/^\/+/, '');}
function loadCardEffectRuntime(){return new Promise(function(resolve,reject){if(window.LWF&&LWF.Loader){resolve();return;}var s=document.createElement('script');s.src=cardEffectUrl('lwf.js');s.onload=function(){resolve();};s.onerror=function(){reject(new Error('Could not load '+s.src));};document.head.appendChild(s);});}
function transparentTexture(w,h){var c=document.createElement('canvas');c.width=w||1;c.height=h||1;return c;}
function loadEffectImage(name,w,h){return new Promise(function(resolve){var img=new Image();img.crossOrigin='anonymous';img.onload=function(){resolve(img);};img.onerror=function(){resolve(transparentTexture(w,h));};img.src=cardEffectUrl(name);});}
function centerCardEffectMovie(movie){
var b=movie&&movie.getBounds&&movie.getBounds(),bw,bh,scale,cx,cy;
if(!b||!isFinite(b.xMin)||!isFinite(b.xMax)||!isFinite(b.yMin)||!isFinite(b.yMax)){movie.moveTo(CARD_EFFECT_W/2,CARD_EFFECT_H/2);return;}
bw=Math.max(1,b.xMax-b.xMin);bh=Math.max(1,b.yMax-b.yMin);
scale=Math.min((CARD_EFFECT_W*0.88)/bw,(CARD_EFFECT_H*0.68)/bh);
scale=Math.max(0.55,Math.min(2.8,scale));
cx=(b.xMin+b.xMax)*0.5*scale;cy=(b.yMin+b.yMax)*0.5*scale;
movie.scaleTo(scale,scale);movie.moveTo((CARD_EFFECT_W/2)-cx,(CARD_EFFECT_H/2)-cy);
}
async function initCardEffect(){
var resp,buf,data,cache={},i,tex,factory,movie;
if(cardEffectState.loading||cardEffectState.ready)return;
cardEffectState.loading=true;
try{
await loadCardEffectRuntime();
if(!window.LWF||!LWF.Loader){throw new Error('LWF runtime not loaded');}
resp=await fetch(cardEffectUrl('icon_rare_20000.lwf'),{cache:'force-cache'});
if(!resp.ok){throw new Error('Could not load icon_rare_20000.lwf');}
buf=await resp.arrayBuffer();data=LWF.Loader.loadArrayBuffer(buf);
if(!data||!data.check()){throw new Error('Invalid LWF data');}
for(i=0;i<data.textures.length;i++){tex=data.textures[i];cache[tex.filename]=await loadEffectImage(tex.filename,tex.width,tex.height);}
cardEffectState.source=document.createElement('canvas');
cardEffectState.source.width=CARD_EFFECT_W;cardEffectState.source.height=CARD_EFFECT_H;
LWF.useCanvasRenderer();
factory=new LWF.CanvasRendererFactory(data,LWF.ResourceCache.get(),cache,cardEffectState.source,false,true,false);
cardEffectState.lwf=new LWF.LWF(data,factory,null,null);
movie=cardEffectState.lwf.rootMovie.attachMovie(CARD_EFFECT,'card_effect',{depth:1});
if(movie){movie.gotoAndPlay(1);movie.moveTo(0,0);movie.scaleTo(1,1);movie.requestCalculateBounds(function(){centerCardEffectMovie(this);});}
cardEffectState.ready=!!movie;mountCardEffects();
if(cardEffectState.ready){requestAnimationFrame(stepCardEffect);}
}catch(e){console.warn('Card effect disabled:',e.message||e);}
}
function mountCardEffects(){cardEffectState.targets=Array.prototype.slice.call(document.querySelectorAll('.card-effect-canvas'));}
function paintCardEffect(){
var src=cardEffectState.source,targets=cardEffectState.targets,next=[],i,c,ctx;
if(!src)return;
for(i=0;i<targets.length;i++){c=targets[i];if(!c||!c.isConnected)continue;next.push(c);ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(src,0,0,c.width,c.height);}
cardEffectState.targets=next;
}
function stepCardEffect(now){
var tick;
if(!cardEffectState.ready)return;
if(!cardEffectState.lastTime)cardEffectState.lastTime=now;
tick=Math.min(0.08,Math.max(0,(now-cardEffectState.lastTime)/1000));
cardEffectState.lastTime=now;
cardEffectState.lwf.exec(tick);cardEffectState.lwf.render();paintCardEffect();
requestAnimationFrame(stepCardEffect);
}
initCardEffect();
</script>

function pagi(){var total=Math.ceil(F.length/PER_PAGE)||1,h='<span class="pagi-count">'+F.length+' cards</span>';h+='<button class="pagi-btn" onclick="PAGE=0;rnd()"'+(PAGE==0?' disabled':'')+'>&laquo;</button>';h+='<button class="pagi-btn" onclick="PAGE--;rnd()"'+(PAGE==0?' disabled':'')+'>&lt;</button>';var st=Math.max(0,PAGE-2),en=Math.min(total,st+5);for(var i=st;i<en;i++){h+='<button class="pagi-btn'+(i==PAGE?' active':'')+'" onclick="PAGE='+i+';rnd()">'+(i+1)+'</button>';}h+='<button class="pagi-btn" onclick="PAGE++;rnd()"'+(PAGE>=total-1?' disabled':'')+'>&gt;</button>';h+='<button class="pagi-btn" onclick="PAGE='+(total-1)+';rnd()"'+(PAGE>=total-1?' disabled':'')+'>&raquo;</button>';document.getElementById("pagi").innerHTML=h;document.getElementById("pageNum").value=PAGE+1;document.getElementById("pageNum").max=total;}
function goPage(){var v=parseInt(document.getElementById("pageNum").value)||1,total=Math.ceil(F.length/PER_PAGE)||1;PAGE=Math.max(0,Math.min(total-1,v-1));rnd();}
function tog(uid){if(Q.length>=6){var idx=Q.findIndex(function(q){return q.uid==uid;});if(idx<0)return;Q.splice(idx,1);}else{var x=D.find(function(d){return d.uid==uid;});if(!x)return;var idx=Q.findIndex(function(q){return q.uid==uid;});if(idx>=0)Q.splice(idx,1);else Q.push(x);}upQ();rnd();}
function rmQ(uid){Q=Q.filter(function(q){return q.uid!=uid;});upQ();rnd();}
function upQ(){var q=document.getElementById("queue"),btn=document.getElementById("btnGo");document.getElementById("cnt").textContent=Q.length+"/6";document.getElementById("cnt2").textContent=Q.length+"/6";if(Q.length==0){q.innerHTML='<span class="queue-empty">Click cards to build team (max 6)...</span>';btn.classList.add("off");}else{var h="";for(var i=0;i<Q.length;i++){var x=Q[i],lbl=i==0?"LEADER":(i+1);h+='<div class="queue-item'+(i==0?" leader":"")+'"><img src="'+proxyImg(x.th)+'"><button class="rm-btn" onclick="event.stopPropagation();rmQ('+x.uid+')">X</button><div class="pos">'+lbl+'</div></div>';}q.innerHTML=h;btn.classList.remove("off");}}
function clrQ(){Q=[];upQ();rnd();}
function fillDeckSelect(){var sel=document.getElementById("deck");for(var i=1;i<=50;i++){var o=document.createElement("option");o.value=i;o.textContent="Deck "+i;sel.appendChild(o);}}
var savedTeams=[];
function showToast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.className="toast "+type+" show";setTimeout(function(){t.className="toast";},2500);}
function doSave(){
if(Q.length==0)return;
var uids=Q.map(function(q){return q.uid;}),deck=document.getElementById("deck").value;
var btn=document.getElementById("btnGo");
btn.textContent="SAVING...";btn.classList.add("off");
fetch('http://127.0.0.1:'+PORT+'/team_save?uids='+uids.join(',')+'&deck='+deck)
.then(function(r){return r.json();})
.then(function(data){
if(data.success){
showToast('Deck '+deck+' saved!','success');
var cards=Q.map(function(q){return{uid:q.uid,th:q.th};});
savedTeams.push({deck:parseInt(deck),cards:cards});
renderSavedTeams();
Q=[];upQ();rnd();
var sel=document.getElementById("deck");
var next=parseInt(deck)+1;
if(next<=50)sel.value=next;
}else{showToast(data.message||'Save failed!','error');}
btn.textContent="SAVE TEAM";
if(Q.length>0)btn.classList.remove("off");
})
.catch(function(e){showToast('Error: '+e.message,'error');btn.textContent="SAVE TEAM";if(Q.length>0)btn.classList.remove("off");});
}
function renderSavedTeams(){
var sec=document.getElementById("savedSection"),list=document.getElementById("savedList");
if(savedTeams.length==0){sec.style.display="none";return;}
sec.style.display="";
var h="";
for(var i=savedTeams.length-1;i>=0;i--){
var t=savedTeams[i];
h+='<div class="saved-item"><div class="saved-deck">DECK '+t.deck+'</div><div class="saved-cards">';
for(var j=0;j<t.cards.length;j++){
h+='<img src="'+proxyImg(t.cards[j].th)+'"'+(j==0?' class="leader-img"':'')+' loading="lazy">';
}
h+='</div></div>';
}
list.innerHTML=h;
}
fillDeckSelect();flt();

if(pg){
var sec=document.createElement('div');sec.className='saved-section';sec.id='savedSection';sec.style.display='none';
sec.innerHTML='<div class="saved-title">SAVED TEAMS THIS SESSION</div><div class="saved-list" id="savedList"></div>';
pg.appendChild(sec);
}
var t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);
})();
